[project]
name = "ai-customer-service-backend"
version = "0.1.0"
description = "Backend skeleton for AI customer service platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
  "sqlalchemy==2.0.52",
  "asyncpg==0.31.0",
  "aiosqlite==0.22.1",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "passlib==1.7.4",
  "bcrypt==4.0.1",
  "cryptography==46.0.5",
  "python-multipart==0.0.32",
  "httpx==0.28.1",
  "tenacity==9.1.4",
  "tzdata==2026.3",
  "alembic==1.19.2"
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.6",
  "mypy==2.3.1"
]

[project.scripts]
ai-cs-worker = "app.worker:main"

[build-system]
requires = ["hatchling>=1.26.3"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uvicorn]
factory = false

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "DTZ"]
ignore = ["B008", "UP037"]

[[tool.mypy.overrides]]
module = "passlib.*"
ignore_missing_imports = true
